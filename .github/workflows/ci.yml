name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run actionlint
        # Statically analyzes the workflows (untrusted input injection, bad refs).
        # The checksum pins the release archive for supply chain integrity.
        run: |
          wget -q https://github.com/rhysd/actionlint/releases/download/v1.7.0/actionlint_1.7.0_linux_amd64.tar.gz
          echo "8aae9148f61952d11a97651852fdc7dffd2b762ed3cdd28b3c2232ae5f55d4db  actionlint_1.7.0_linux_amd64.tar.gz" | sha256sum -c -
          tar -xzf actionlint_1.7.0_linux_amd64.tar.gz actionlint
          ./actionlint

  brew-audit:
    name: brew audit
    # Casks only audit on macOS; the hosted macOS runner ships Homebrew.
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tap this checkout
        run: brew tap n24q02m/tap "$GITHUB_WORKSPACE"
      - name: Trust this tap
        # Homebrew refuses to load casks from an untrusted tap; this is our own checkout.
        run: brew trust n24q02m/tap
      - name: Audit casks
        env:
          # --online hits the GitHub API; unauthenticated runner IPs hit the 60/hr limit.
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          casks=(Casks/*.rb)
          formulae=(Formula/*.rb)
          for f in "${casks[@]}"; do
            brew audit --cask --strict --online "n24q02m/tap/$(basename "$f" .rb)"
          done
          for f in "${formulae[@]}"; do
            brew audit --formula --strict --online "n24q02m/tap/$(basename "$f" .rb)"
          done

  bump-script:
    name: bump script tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit tests (offline)
        run: python3 -m unittest discover -s scripts -p "test_*.py" -v
      - name: Formulae match the registry latest release
        # Read-only drift report: a release published since the last bump shows here.
        run: |
          for f in Formula/*.rb; do
            python3 scripts/bump.py "$(basename "$f" .rb)" --formula "$f" --check
          done

  brew-install:
    name: brew install (${{ matrix.formula }})
    # Installs every formula on the hosted macOS runner and runs its `brew test`
    # (`<cli> --version` must print the formula version).
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        formula: [wet, mnemo, crg, telegram, notion, email, workspace]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tap this checkout
        run: brew tap n24q02m/tap "$GITHUB_WORKSPACE"
      - name: Trust this tap
        run: brew trust n24q02m/tap
      - name: Install
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          FORMULA: ${{ matrix.formula }}
        run: brew install --formula "n24q02m/tap/$FORMULA"
      - name: Test
        env:
          FORMULA: ${{ matrix.formula }}
        run: brew test "n24q02m/tap/$FORMULA"
