name: Bump

# Points one formula at a registry release: scripts/bump.py reads the artifact URL and
# sha256 from the registry, regenerates the hash-pinned lock files, then this job opens
# a pull request and merges it once every check on it passes.
"on":
  workflow_dispatch:
    inputs:
      package:
        description: Formula to bump
        required: true
        type: choice
        options: [wet, mnemo, crg, telegram, notion, email, workspace]
      version:
        description: Stable release to pin (empty = registry latest)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # One bump per package at a time. A group holds a single pending run, so a shared group
  # would cancel queued bumps of other packages; bumps of different packages touch
  # disjoint files and merge independently.
  group: bump-${{ inputs.package }}
  cancel-in-progress: false

jobs:
  bump:
    name: bump ${{ inputs.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Rewrite the formula and its lock files
        id: bump
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
        run: |
          args=("$PACKAGE" --formula "Formula/$PACKAGE.rb")
          if [ -n "$VERSION" ]; then
            [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]] || { echo "::error::version must be a stable release"; exit 1; }
            args+=(--version "$VERSION")
          fi
          python3 scripts/bump.py "${args[@]}"
      - name: Open the pull request and merge it once its checks pass
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git add "Formula/$PACKAGE.rb" locks
          if git diff --cached --quiet; then
            echo "::notice::$PACKAGE is already at $VERSION"
            exit 0
          fi
          branch="bump/$PACKAGE-$VERSION"
          title="feat: bump $PACKAGE to $VERSION"
          bot_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit --quiet -m "$title"
          git push --force --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$branch"
          head="$(git rev-parse HEAD)"
          pr="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr" ]; then
            gh pr create --base main --head "$branch" --title "$title" \
              --body "Generated by \`bump.yml\`: \`scripts/bump.py $PACKAGE --formula Formula/$PACKAGE.rb\` for $PACKAGE $VERSION from the registry, with regenerated lock files."
            pr="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')"
          fi
          # Checks register a few seconds after the push; wait for them before watching.
          for _ in $(seq 60); do
            count="$(gh pr view "$pr" --json statusCheckRollup --jq '.statusCheckRollup | length')"
            [ "$count" -gt 0 ] && break
            sleep 10
          done
          gh pr checks "$pr" --watch --fail-fast --interval 30
          # Code scanning reports after CI starts; watch again so a late check also gates.
          sleep 60
          gh pr checks "$pr" --watch --fail-fast --interval 30
          gh pr merge "$pr" --squash --match-head-commit "$head"
